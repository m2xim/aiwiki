name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./... -count=1

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Integration QA
        run: node scripts/qa.mjs

      - name: History diff checks
        run: node scripts/qa-diff.mjs

      - name: Install benchmark development dependencies
        run: npm ci --prefix benchmarks/mcp

      - name: Benchmark grader regression checks (no model calls)
        run: node --test benchmarks/mcp/grading.test.mjs benchmarks/mcp/candidate-grading.test.mjs

      - name: Section evaluation syntax checks (no model calls)
        run: |
          node --check benchmarks/mcp/section-search-eval.mjs
          node --check benchmarks/mcp/section-queries-v2.mjs
