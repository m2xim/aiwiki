name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./... -count=1

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Markdown formatting checks
        run: node scripts/qa-markdown-format.mjs

      - name: Integration QA
        run: node scripts/qa.mjs

      - name: Catalog query checks
        run: node scripts/qa-catalog-query.mjs

      - name: Artifact kit checks
        run: node scripts/qa-kit.mjs

      - name: History diff checks
        run: node scripts/qa-diff.mjs

      - name: Artifact interface checks
        run: node scripts/qa-artifacts.mjs

      - name: Safe move checks
        run: node scripts/qa-move.mjs

      - name: Export and Markdown import checks
        run: |
          node scripts/qa-export.mjs
          node scripts/qa-import.mjs

      - name: Install benchmark development dependencies
        run: npm ci --prefix benchmarks/mcp

      - name: Benchmark grader regression checks (no model calls)
        run: node --test benchmarks/mcp/grading.test.mjs benchmarks/mcp/candidate-grading.test.mjs

      - name: Section evaluation syntax checks (no model calls)
        run: |
          node --check benchmarks/mcp/section-search-eval.mjs
          node --check benchmarks/mcp/section-queries-v2.mjs

  corporate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: aiwiki_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIWIKI_TEST_POSTGRES_OWNER: postgres://aiwiki_owner:owner-ci-only@127.0.0.1:5432/aiwiki_ci?sslmode=disable
      AIWIKI_TEST_POSTGRES: postgres://aiwiki_app:app-ci-only@127.0.0.1:5432/aiwiki_ci?sslmode=disable
      AIWIKI_TEST_KEYCLOAK_ISSUER: http://127.0.0.1:58080/realms/aiwiki-oauth-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Create separate migration and runtime roles
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d aiwiki_ci -v ON_ERROR_STOP=1 -c
          "CREATE ROLE aiwiki_owner LOGIN PASSWORD 'owner-ci-only' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE aiwiki_app LOGIN PASSWORD 'app-ci-only' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE aiwiki_ci OWNER TO aiwiki_owner;
          GRANT ALL ON SCHEMA public TO aiwiki_owner;"
      - name: Start disposable Keycloak 26.8.0 with the OAuth test realm
        run: |
          docker run -d --name keycloak-oauth -p 127.0.0.1:58080:8080 \
            -v "$GITHUB_WORKSPACE/internal/server/testdata/keycloak-oauth-realm.json:/opt/keycloak/data/import/aiwiki-oauth-test-realm.json:ro" \
            quay.io/keycloak/keycloak:26.8.0 start-dev --import-realm \
            --features=resource-indicators --hostname=http://127.0.0.1:58080
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null --max-time 2 "$AIWIKI_TEST_KEYCLOAK_ISSUER/.well-known/openid-configuration"; then
              echo "Keycloak ready on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "Keycloak did not become ready within 45 attempts (at most about 180 seconds)" >&2
          docker logs keycloak-oauth >&2 || true
          exit 1
      - name: Corporate PostgreSQL, signed OIDC, object storage and Keycloak OAuth checks
        run: go test ./internal/server -run 'TestCorporate|TestAuth|TestStorage|TestS3|TestMCPDelegation|TestMCPScope|TestMCPPersistent|TestKeycloakAdmission|TestMCPOAuth' -count=1 -v
